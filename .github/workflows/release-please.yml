name: release-please

# On every push to main, release-please analyzes conventional commits since the
# last release. If a version bump is warranted (feat = minor, fix = patch,
# ! = major), it creates or updates a "Release PR" that auto-merges.
#
# When the Release PR merges, this workflow runs again. release-please creates
# the git tag + GitHub Release, then the publish job builds and publishes to
# PyPI via OIDC trusted publishing (no API token).
#
# The Release PR updates every committed release artifact atomically, including
# uv.lock. Publishing refuses inconsistent source versions, tags, or artifacts.
#
# IMPORTANT: Uses RELEASE_PLEASE_TOKEN (a Personal Access Token) instead of
# GITHUB_TOKEN. PRs created by GITHUB_TOKEN don't trigger downstream workflow
# runs (GitHub prevents this to avoid loops). A PAT-authored PR merge DOES
# trigger the push event → release-please detects the release → creates tag.
#
# Setup: create a fine-grained PAT with contents:write + pull-requests:write,
# add as repo secret RELEASE_PLEASE_TOKEN.
#
# PyPI trusted publisher must be configured with:
#   workflow = release-please.yml, environment = pypi
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish (e.g. v0.1.13)"
        required: true
        type: string

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Require release automation token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "RELEASE_PLEASE_TOKEN is required so generated PRs trigger CI" >&2
            exit 1
          fi

      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # PAT required: GITHUB_TOKEN PRs don't trigger push events on merge
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag_name || needs.release-please.outputs.tag_name }}

      - uses: astral-sh/setup-uv@v7

      - name: Verify release source
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag_name || needs.release-please.outputs.tag_name }}
        run: |
          uv lock --check
          python scripts/check-release-integrity.py --tag "$RELEASE_TAG"

      - name: Build distributions
        run: uv build

      - name: Verify distribution metadata
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag_name || needs.release-please.outputs.tag_name }}
        run: python scripts/check-release-integrity.py --tag "$RELEASE_TAG" --dist dist

      - uses: pypa/gh-action-pypi-publish@release/v1
