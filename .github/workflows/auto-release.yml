name: auto-release

# On push to main: if the version in pyproject.toml doesn't have a
# matching git tag yet, create the tag + a GitHub Release so the
# release workflow (trusted-publisher OIDC) publishes to PyPI.
on:
  push:
    branches: [main]

permissions:
  contents: write   # to push the tag + create the release

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    if: github.event.pusher.name != 'github-actions[bot]'  # prevent loop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag v${{ steps.version.outputs.value }} already exists
        id: check
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already tagged — skip"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No tag for $TAG — will release"
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          gh release create "$TAG" \
            --title "lorekeep $TAG" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
