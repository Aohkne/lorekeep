[project]
name = "laputa"
version = "0.1.0"
description = "Temporal knowledge graph for AI agents via MCP"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "mistune>=3.0",
  "litellm>=1.40",
  "typer>=0.12",
  "rich>=13.7",
  "networkx>=3.2",
  "mcp>=1.0",
]

[project.scripts]
laputa = "laputa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laputa"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
